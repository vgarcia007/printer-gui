# Replace every value in angle brackets before enabling this site.
# Keep real hostnames, certificate paths, credentials, and private addresses out of Git.

<VirtualHost *:80>
    ServerName <APP_HOSTNAME>
    Redirect permanent / https://<APP_HOSTNAME>/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName <APP_HOSTNAME>

    SSLEngine on
    SSLCertificateFile <TLS_FULLCHAIN_PATH>
    SSLCertificateKeyFile <TLS_PRIVATE_KEY_PATH>

    # This application has no user accounts. Restrict it to a trusted network,
    # or replace this block with authentication supplied by your reverse proxy.
    <Location />
        <RequireAny>
            Require local
            Require ip <TRUSTED_NETWORK>
        </RequireAny>
    </Location>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:<LOCAL_APP_PORT>/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:<LOCAL_APP_PORT>/

    ErrorLog ${APACHE_LOG_DIR}/print-scan-hub-error.log
    CustomLog ${APACHE_LOG_DIR}/print-scan-hub-access.log combined
</VirtualHost>
</IfModule>
