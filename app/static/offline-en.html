<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212529">
  <title>Print & Scan Hub is offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #212529; color: #f8f9fa; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
    img { width: 5rem; height: 5rem; }
    h1 { margin: 1rem 0 .5rem; font-size: 1.75rem; }
    p { color: #adb5bd; line-height: 1.55; }
    .retry { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .45rem; color: #fff; background: #4e8cca; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Print & Scan Hub is offline</h1>
    <p>Reconnect to the server, then try again. Printing, scanning, and saved files require a live connection.</p>
    <a class="retry" href="/">Try again</a>
  </main>
</body>
</html>
