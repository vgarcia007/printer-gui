<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4d">
  <link rel="icon" href="/icon.png">
  <title>Drucken</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201c;
      --muted: #66716b;
      --surface: #fff;
      --canvas: #f3f5f2;
      --line: #dfe5e0;
      --accent: #176b4d;
      --accent-hover: #10593f;
      --accent-soft: #e8f3ed;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(25, 42, 33, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, select { font: inherit; }

    .shell {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 44px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 750;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b7bdb9;
    }

    .status.ready::before { background: #2ca66f; }
    .status.error::before { background: var(--danger); }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .lead {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 16px;
    }

    .printer-field {
      display: grid;
      grid-template-columns: 115px 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .72);
    }

    .printer-field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .job-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .job-copy { min-width: 0; }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .hint {
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button {
      flex: 0 0 auto;
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--accent);
      font-weight: 750;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease, opacity .16s ease;
    }

    .button:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    .button:disabled { cursor: not-allowed; opacity: .42; }
    .button.secondary { width: 100%; margin-top: 16px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #929b96;
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 32px;
      border: 2px dashed #cbd5cf;
      border-radius: 22px;
      background: rgba(255, 255, 255, .5);
      text-align: center;
      cursor: pointer;
      transition: border .16s ease, background .16s ease, transform .16s ease;
    }

    .drop-zone:hover, .drop-zone.dragging {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .drop-zone input { display: none; }

    .upload-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 16px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .drop-title { margin: 0 0 6px; font-weight: 800; }
    .drop-hint { margin: 0; color: var(--muted); font-size: 14px; }

    .file-card {
      display: none;
      align-items: center;
      gap: 13px;
      margin-top: 14px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .file-card.visible { display: flex; }
    .file-meta { min-width: 0; flex: 1; }
    .file-name { overflow: hidden; font-size: 14px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .remove { padding: 6px; border: 0; color: var(--muted); background: none; cursor: pointer; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      max-width: min(520px, calc(100% - 32px));
      padding: 13px 17px;
      border-radius: 13px;
      color: #fff;
      background: #1f2924;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
      font-size: 14px;
      font-weight: 650;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--danger); }
    .busy .button { pointer-events: none; opacity: .55; }

    @media (max-width: 580px) {
      .shell { width: min(100% - 24px, 760px); padding-top: 20px; }
      header { margin-bottom: 26px; }
      .printer-field { grid-template-columns: 1fr; gap: 5px; }
      .card { padding: 20px; }
      .job-row { align-items: stretch; flex-direction: column; }
      .job-row .button { width: 100%; }
      .drop-zone { min-height: 210px; padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7v-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M17.5 11h.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
        Drucken
      </div>
      <div id="serviceStatus" class="status">Verbinden …</div>
    </header>

    <h1>Was möchtest du drucken?</h1>
    <p class="lead">Drucker wählen, PDF ablegen, fertig.</p>

    <div class="printer-field">
      <label for="printer">Drucker</label>
      <select id="printer" aria-label="Drucker auswählen" disabled>
        <option>Drucker werden geladen …</option>
      </select>
    </div>

    <section class="card" aria-labelledby="jobsTitle">
      <div class="job-row">
        <div class="job-copy">
          <div class="eyebrow">Jobs-Ordner</div>
          <h2 id="jobsTitle">Alle PDFs drucken</h2>
          <p id="jobsHint" class="hint">Ordner wird geprüft …</p>
        </div>
        <button id="printJobs" class="button" disabled>Alle drucken</button>
      </div>
    </section>

    <div class="divider">oder</div>

    <section>
      <label id="dropZone" class="drop-zone" for="fileInput">
        <input id="fileInput" type="file" accept="application/pdf,.pdf">
        <span>
          <span class="upload-icon" aria-hidden="true">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <p class="drop-title">PDF hier ablegen</p>
          <p class="drop-hint">oder klicken, um eine Datei auszuwählen</p>
        </span>
      </label>

      <div id="fileCard" class="file-card">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 2h7l5 5v15H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="#176b4d" stroke-width="1.8"/><path d="M14 2v6h5" stroke="#176b4d" stroke-width="1.8"/></svg>
        <div class="file-meta">
          <div id="fileName" class="file-name"></div>
          <div id="fileSize" class="file-size"></div>
        </div>
        <button id="removeFile" class="remove" aria-label="Datei entfernen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button id="printFile" class="button secondary" disabled>PDF drucken</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const printer = $("#printer");
    const printJobs = $("#printJobs");
    const printFile = $("#printFile");
    const fileInput = $("#fileInput");
    const dropZone = $("#dropZone");
    const fileCard = $("#fileCard");
    const serviceStatus = $("#serviceStatus");
    let selectedFile = null;
    let toastTimer = null;
    let busy = false;

    function showToast(message, isError = false) {
      const toast = $("#toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", isError);
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 4500);
    }

    function formatBytes(bytes) {
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function setFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".pdf") && file.type !== "application/pdf") {
        showToast("Bitte wähle eine PDF-Datei aus.", true);
        return;
      }
      selectedFile = file;
      $("#fileName").textContent = file.name;
      $("#fileSize").textContent = formatBytes(file.size);
      fileCard.classList.add("visible");
      printFile.disabled = !printer.value;
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = "";
      fileCard.classList.remove("visible");
      printFile.disabled = true;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      let data;
      try { data = await response.json(); } catch { data = {}; }
      if (!response.ok || !data.ok) throw new Error(data.error || "Der Druckdienst antwortet nicht.");
      return data;
    }

    async function refreshStatus({notify = false} = {}) {
      if (busy) return;
      try {
        const data = await api("/api/status");
        const previous = printer.value;
        printer.replaceChildren();
        for (const item of data.printers) {
          const option = document.createElement("option");
          option.value = item.name;
          option.textContent = `${item.label}${item.ready ? " · Bereit" : " · Nicht bereit"}`;
          printer.append(option);
        }
        const preferred = data.printers.some(item => item.name === previous)
          ? previous
          : data.defaultPrinter;
        if (preferred) printer.value = preferred;
        printer.disabled = data.printers.length === 0;

        const readyCount = data.printers.filter(item => item.ready).length;
        if (!data.printers.length) {
          serviceStatus.textContent = "Kein Drucker";
          serviceStatus.className = "status error";
        } else {
          serviceStatus.textContent = readyCount === data.printers.length
            ? `${readyCount} Drucker bereit`
            : `${readyCount} von ${data.printers.length} bereit`;
          serviceStatus.className = `status ${readyCount ? "ready" : "error"}`;
        }

        const count = data.jobCount;
        $("#jobsHint").textContent = count === 0
          ? "Keine PDFs im Jobs-Ordner"
          : count === 1 ? data.jobs[0] : `${count} PDFs warten im Ordner`;
        printJobs.disabled = count === 0 || printer.disabled;
        printJobs.textContent = count > 1 ? `${count} PDFs drucken` : "Alle drucken";
        printFile.disabled = !selectedFile || printer.disabled;
      } catch (error) {
        serviceStatus.textContent = "Nicht verbunden";
        serviceStatus.className = "status error";
        printer.innerHTML = "<option>Druckdienst nicht verfügbar</option>";
        printer.disabled = true;
        printJobs.disabled = true;
        printFile.disabled = true;
        if (notify) showToast(error.message, true);
      }
    }

    async function runPrint(action, clearOnFailure = false) {
      busy = true;
      document.body.classList.add("busy");
      try {
        const count = await action();
        showToast(count === 1
          ? "PDF wurde an den Drucker gesendet."
          : `${count} PDFs wurden an den Drucker gesendet.`);
        clearFile();
      } catch (error) {
        if (clearOnFailure) clearFile();
        showToast(error.message, true);
      } finally {
        busy = false;
        document.body.classList.remove("busy");
        await refreshStatus();
      }
    }

    fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
    $("#removeFile").addEventListener("click", clearFile);
    ["dragenter", "dragover"].forEach(type => dropZone.addEventListener(type, event => {
      event.preventDefault();
      dropZone.classList.add("dragging");
    }));
    ["dragleave", "drop"].forEach(type => dropZone.addEventListener(type, event => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
    }));
    dropZone.addEventListener("drop", event => setFile(event.dataTransfer.files[0]));

    printJobs.addEventListener("click", () => runPrint(async () => {
      const data = await api("/api/print-jobs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({printer: printer.value})
      });
      return data.printed;
    }));

    printFile.addEventListener("click", () => runPrint(async () => {
      const query = new URLSearchParams({printer: printer.value, filename: selectedFile.name});
      const data = await api(`/api/print-pdf?${query}`, {
        method: "POST",
        headers: {"Content-Type": "application/pdf"},
        body: selectedFile
      });
      return data.printed;
    }, true));

    printer.addEventListener("change", () => { printFile.disabled = !selectedFile; });
    refreshStatus({notify: true});
    setInterval(() => refreshStatus(), 15000);
  </script>
</body>
</html>
