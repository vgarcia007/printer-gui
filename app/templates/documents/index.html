{% extends "base.html" %}
{% block title %}{{ t("Print a document") }} · Print & Scan Hub{% endblock %}
{% block content %}
<section class="editor-view document-view" aria-labelledby="documentPageTitle">
  <div class="editor-heading">
    <div>
      <h1 id="documentPageTitle">{{ t("Print a PDF") }}</h1>
      <p>{{ t("The PDF will be sent to the selected printer.") }}</p>
    </div>
  </div>

  <div class="document-workbench">
    <div class="document-upload-frame">
      <label id="dropZone" class="drop-zone" for="fileInput">
        <input id="fileInput" type="file" accept="application/pdf,.pdf">
        <i class="fas fa-file-upload drop-zone-icon" aria-hidden="true"></i>
        <strong>{{ t("Drop a PDF here") }}</strong>
        <span>{{ t("or click to choose one") }}</span>
      </label>
      <div id="fileCard" class="file-card document-file-card" hidden>
        <i class="far fa-file-pdf document-file-icon" aria-hidden="true"></i>
        <div class="document-file-copy"><strong id="fileName"></strong><small id="fileSize"></small></div>
        <button id="removeFile" class="text-button" type="button"><i class="fas fa-times button-icon" aria-hidden="true"></i>{{ t("Remove") }}</button>
      </div>
      <div id="documentStatus" class="document-statusbar" role="status" aria-live="polite">{{ t("Connecting…") }}</div>
    </div>

    <div class="document-action-panel">
      <div class="document-printer-field">
        <label for="printer">{{ t("Printer") }}</label>
        <select id="printer" disabled><option>{{ t("Loading printers…") }}</option></select>
      </div>
      <button id="printFile" class="scan-main-action" type="button" disabled><i class="fas fa-print button-icon" aria-hidden="true"></i>{{ t("Print PDF") }}</button>
    </div>
  </div>
</section>
<div id="toast" class="toast-message" role="status" aria-live="polite" hidden></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/documents.js', v='20260822-2') }}"></script>{% endblock %}
