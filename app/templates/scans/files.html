{% extends "base.html" %}
{% block title %}Scanned PDFs · Print & Scan{% endblock %}
{% block content %}
<section class="library-page">
  <div class="simple-heading">
    <div><h1>Scanned PDFs</h1><p>Click a name to rename it. Changes are saved with Enter.</p></div>
    <a class="primary link-button" href="{{ url_for('scans.index') }}"><i class="fas fa-plus" aria-hidden="true"></i>New scan</a>
  </div>
  <div id="filesMessage" class="file-list-message" role="status">Loading files…</div>
  <div id="scanFiles" class="scan-file-list" data-scan-file-list data-message-id="filesMessage"></div>
</section>
{% include "scans/_print_modal.html" %}
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/scan-files.js', v='20260823-1') }}"></script>{% endblock %}
