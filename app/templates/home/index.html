{% extends "base.html" %}
{% block title %}Print & Scan Hub{% endblock %}
{% block content %}
<section class="home-stage">
  <div class="home-face" aria-hidden="true"><i class="far fa-smile"></i></div>
  <h1>Hello. What are we making?</h1>
  <p>Pick a task and we will take care of the details.</p>
  <div class="home-actions">
    <a href="{{ url_for('documents.index') }}"><i class="far fa-file-pdf" aria-hidden="true"></i><span><strong>Print a PDF</strong><small>HP or Brother</small></span><i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    <a href="{{ url_for('labels.index') }}"><i class="fas fa-tag" aria-hidden="true"></i><span><strong>Make a label</strong><small>Design and print on DYMO</small></span><i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    <a href="{{ url_for('scans.index') }}"><i class="fas fa-file-import" aria-hidden="true"></i><span><strong>Scan pages</strong><small>Color, OCR and two-sided</small></span><i class="fas fa-arrow-right" aria-hidden="true"></i></a>
  </div>
</section>
{% endblock %}
