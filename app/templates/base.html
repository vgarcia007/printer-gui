<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b4d">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Print & Scan Hub{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20260822-3') }}">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="{{ url_for('home.index') }}">Print & Scan Hub</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('documents.index') }}">Print</a>
        <a href="{{ url_for('labels.index') }}">Labels</a>
        <a href="{{ url_for('scans.index') }}">Scan</a>
      </nav>
    </div>
  </header>
  <main class="shell main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
