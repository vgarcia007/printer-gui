<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Label Designer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#fbf8ff",
                        "on-error-container": "#93000a",
                        "surface-container": "#ededfa",
                        "primary-fixed-dim": "#b8c3ff",
                        "on-surface": "#191b24",
                        "on-tertiary-fixed-variant": "#812800",
                        "surface-dim": "#d9d9e6",
                        "surface-variant": "#e2e1ef",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "error": "#ba1a1a",
                        "outline": "#747688",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#d0e1fb",
                        "surface-bright": "#fbf8ff",
                        "on-primary-container": "#efefff",
                        "on-primary-fixed": "#001356",
                        "status-error": "#EF4444",
                        "tertiary-fixed": "#ffdbcf",
                        "on-primary-fixed-variant": "#0035be",
                        "surface-tint": "#124af0",
                        "tertiary-fixed-dim": "#ffb59b",
                        "scan-teal": "#0D9488",
                        "on-secondary-container": "#54647a",
                        "surface-container-low": "#f3f2ff",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-high": "#e7e7f4",
                        "tertiary-container": "#c24100",
                        "outline-variant": "#c4c5d9",
                        "inverse-surface": "#2e303a",
                        "on-tertiary": "#ffffff",
                        "primary": "#0040e0",
                        "primary-fixed": "#dde1ff",
                        "soft-blue-bg": "#F8FAFC",
                        "on-background": "#191b24",
                        "on-primary": "#ffffff",
                        "tertiary": "#993100",
                        "on-tertiary-fixed": "#380d00",
                        "error-container": "#ffdad6",
                        "primary-container": "#2e5bff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "status-success": "#22C55E",
                        "surface": "#fbf8ff",
                        "on-tertiary-container": "#ffece6",
                        "inverse-on-surface": "#f0effd",
                        "inverse-primary": "#b8c3ff",
                        "surface-container-highest": "#e2e1ef",
                        "on-surface-variant": "#434656",
                        "secondary": "#505f76"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "1.25rem",
                        "gutter": "1rem",
                        "container-padding-desktop": "2.5rem",
                        "section-gap": "2rem",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .label-canvas {
            /* Simulating a common Dymo label aspect ratio (e.g., 1-1/8" x 3-1/2") */
            aspect-ratio: 3.5 / 1.125;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .editor-content:empty:before {
            content: attr(data-placeholder);
            color: #747688;
            pointer-events: none;
            display: block;
        }

        .tool-btn {
            @apply flex items-center justify-center w-10 h-10 rounded-lg text-on-surface-variant hover:bg-surface-variant hover:text-primary transition-colors;
        }
        .tool-btn.active {
            @apply bg-primary-container text-on-primary-container;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm">
<div class="flex items-center justify-between px-container-padding-mobile md:px-container-padding-desktop h-16 w-full">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:opacity-90 transition-opacity active:scale-95 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="print_connect">print_connect</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Print &amp; Scan Hub</h1>
</div>
<div class="flex items-center">
<button class="p-2 rounded-full hover:opacity-90 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
</button>
</div>
</div>
</header>
<main class="flex-1 flex flex-col md:flex-row w-full max-w-7xl mx-auto p-container-padding-mobile md:p-container-padding-desktop gap-section-gap pb-24 md:pb-8">
<!-- Editor Controls (Side Panel on Desktop) -->
<aside class="w-full md:w-5/12 flex flex-col gap-6">
<div class="glass-panel rounded-xl p-6 shadow-sm">
<h2 class="font-headline-md text-headline-md mb-4 text-on-surface">Label Designer</h2>
<div class="flex flex-col gap-4">
<!-- Text Formatting Toolbar -->
<div class="flex flex-wrap items-center gap-2 p-2 bg-soft-blue-bg rounded-lg border border-outline-variant/30">
<button class="tool-btn" onclick="document.execCommand('bold',false,null)" title="Bold">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="tool-btn" onclick="document.execCommand('italic',false,null)" title="Italic">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<button class="tool-btn" onclick="document.execCommand('justifyLeft',false,null)" title="Align Left">
<span class="material-symbols-outlined" data-icon="format_align_left">format_align_left</span>
</button>
<button class="tool-btn" onclick="document.execCommand('justifyCenter',false,null)" title="Align Center">
<span class="material-symbols-outlined" data-icon="format_align_center">format_align_center</span>
</button>
<button class="tool-btn" onclick="document.execCommand('justifyRight',false,null)" title="Align Right">
<span class="material-symbols-outlined" data-icon="format_align_right">format_align_right</span>
</button>
<div class="w-px h-6 bg-outline-variant mx-1"></div>
<!-- Font Size Selector -->
<div class="relative flex items-center">
<select class="appearance-none bg-transparent border-none py-1 pl-3 pr-8 font-label-md text-on-surface focus:ring-0 cursor-pointer" onchange="document.execCommand('fontSize', false, this.value)">
<option value="1">Small</option>
<option selected="" value="3">Medium</option>
<option value="5">Large</option>
<option value="7">Extra Large</option>
</select>
<span class="material-symbols-outlined absolute right-1 pointer-events-none text-on-surface-variant text-sm">arrow_drop_down</span>
</div>
</div>
<!-- Label Settings -->
<div class="space-y-3 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant block">Label Size</label>
<div class="relative">
<select class="w-full bg-soft-blue-bg border border-outline-variant/30 rounded-lg py-3 px-4 appearance-none focus:outline-none focus:ring-2 focus:ring-primary/50 text-on-surface font-body-md">
<option>Address (1-1/8" x 3-1/2")</option>
<option>Large Address (1-4/10" x 3-1/2")</option>
<option>Return Address (3/4" x 2")</option>
<option>Shipping (2-5/16" x 4")</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<button class="w-full mt-8 bg-gradient-to-r from-primary to-surface-tint text-on-primary rounded-full py-4 font-label-md text-label-md shadow-md hover:shadow-lg hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="print">print</span>
                    Print Label
                </button>
</div>
</aside>
<!-- Canvas Area (Main content on Desktop) -->
<section class="w-full md:w-7/12 flex flex-col items-center justify-center min-h-[400px] bg-surface-container-low rounded-2xl border border-surface-variant p-8 relative overflow-hidden">
<!-- Subtle background pattern for context -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#0040e0 1px, transparent 1px); background-size: 20px 20px;"></div>
<!-- The Label Canvas -->
<div class="relative w-full max-w-[500px] label-canvas bg-white rounded-md flex items-center p-6 cursor-text transition-shadow focus-within:ring-2 focus-within:ring-primary/30">
<div class="editor-content w-full h-full outline-none resize-none font-body-lg text-on-surface break-words overflow-hidden flex flex-col justify-center" contenteditable="true" data-placeholder="Start typing your label here..." spellcheck="false"></div>
</div>
<p class="mt-6 text-on-surface-variant font-label-sm text-label-sm text-center max-w-sm">
                1:1 Live Preview. What you see is what will be printed.
            </p>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-4 pb-safe bg-surface dark:bg-surface-dim shadow-[0_-4px_15px_rgba(0,0,0,0.05)] rounded-t-xl z-50">
<a class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="scanner">scanner</span>
<span class="font-label-sm text-label-sm">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="folder_open">folder_open</span>
<span class="font-label-sm text-label-sm">Files</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container rounded-full px-5 py-2 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="label">label</span>
<span class="font-label-sm text-label-sm">Labels</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-90 transition-all duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<!-- Contextual FAB (Hidden on desktop, shown on mobile for quick print if canvas has content) -->
<button class="md:hidden fixed bottom-24 right-4 w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:opacity-90 active:scale-90 transition-all z-40">
<span class="material-symbols-outlined" data-icon="print">print</span>
</button>
<script>
        // Simple toolbar active state toggling for demonstration
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // If it's an alignment button, remove active from other alignment buttons
                if(this.title.includes('Align')) {
                    document.querySelectorAll('.tool-btn[title*="Align"]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                } else {
                    this.classList.toggle('active');
                }
            });
        });
    </script>
</body></html>
